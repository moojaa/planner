<title>Weekend ✨</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --grad: linear-gradient(135deg,#ff7eb3,#ff758c 60%,#ff9a76); --accent:#d6336c; --accent-bg:#fff0f3; }
  body { font-family:"Malgun Gothic","Segoe UI","Arial",sans-serif; color:#2b2b2b; background:#f4f5f7; line-height:1.5; font-size:15px; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; background:#fff; }

  /* lock */
  #lock { position:fixed; inset:0; background:linear-gradient(160deg,#ff9a9e,#fecfef 70%,#a8edea); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; padding:24px; }
  #lock .box { background:#fff; border-radius:22px; padding:30px 26px; width:100%; max-width:340px; text-align:center; box-shadow:0 18px 50px rgba(0,0,0,.18); }
  #lock .emo { font-size:46px; }
  #lock h2 { margin:10px 0 4px; font-size:19px; }
  #lock p { color:#868e96; font-size:13px; margin-bottom:18px; }
  #lock input { width:100%; padding:13px 16px; border:2px solid #ffd6e0; border-radius:14px; font-size:16px; text-align:center; outline:none; }
  #lock input:focus { border-color:#ff758c; }
  #lock button { width:100%; margin-top:12px; padding:13px; border:none; border-radius:14px; background:#ff6b8b; color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  #lock #nope { width:auto; background:#fff; color:#adb5bd; border:2px solid #e9ecef; padding:10px 18px; font-size:14px; transition:left .12s ease, top .12s ease; z-index:101; touch-action:none; }
  #lock .err { color:#e8590c; font-size:13px; margin-top:10px; height:16px; }

  /* header */
  .brand { text-align:center; padding:14px 0 6px; font-size:13px; color:#adb5bd; font-weight:700; letter-spacing:1px; }
  .langbtn { position:absolute; top:12px; right:14px; background:#fff; border:1px solid #e9ecef; border-radius:20px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .top { position:relative; }

  /* tabs */
  .tabs { display:flex; gap:8px; padding:6px 14px 12px; }
  .tabs button { flex:1; padding:12px; border:none; border-radius:14px; background:#f1f3f5; color:#868e96; font-size:15px; font-weight:700; cursor:pointer; }
  .tabs button.on { background:var(--grad); color:#fff; box-shadow:0 6px 16px rgba(255,117,140,.35); }
  .subtabs { display:flex; gap:8px; padding:0 14px 10px; }
  .subtabs button { flex:1; padding:9px; border:2px solid #e9ecef; border-radius:12px; background:#fff; color:#868e96; font-size:13.5px; font-weight:700; cursor:pointer; }
  .subtabs button.on { border-color:var(--accent); color:var(--accent); background:var(--accent-bg); }

  /* hero */
  .hero { margin:0 14px 14px; background:var(--grad); color:#fff; border-radius:18px; padding:20px 22px; }
  .hero .tag { font-size:12px; letter-spacing:1.5px; opacity:.92; }
  .hero h1 { font-size:23px; margin:5px 0 3px; }
  .hero .sub { font-size:13.5px; opacity:.95; }

  .sec { padding:0 14px; margin-bottom:16px; }
  .sec-title { font-size:15px; font-weight:700; color:var(--accent); border-left:5px solid var(--accent); padding-left:9px; margin:16px 4px 9px; }

  /* schedule */
  .sched { border-radius:14px; overflow:hidden; border:1px solid #eee; }
  .srow { display:flex; gap:10px; padding:11px 13px; border-bottom:1px solid #f3f3f3; }
  .srow:last-child { border-bottom:none; }
  .stime { font-weight:800; color:var(--accent); white-space:nowrap; width:54px; font-size:13.5px; padding-top:1px; }
  .swhat { flex:1; font-size:14px; }
  .swhat small { color:#adb5bd; font-size:11.5px; }
  .splace { font-size:11.5px; color:#868e96; text-align:right; max-width:42%; }
  .splace a { color:#1c7ed6; text-decoration:none; border-bottom:1px dotted #74c0fc; }

  /* list rows (food/cafe) */
  .grp-label { font-size:13px; font-weight:700; color:var(--accent); margin:12px 4px 6px; }
  .list { border:1px solid #eee; border-radius:14px; overflow:hidden; }
  a.row { display:flex; gap:11px; align-items:center; padding:12px 13px; border-bottom:1px solid #f5f5f5; text-decoration:none; color:inherit; }
  a.row:last-child { border-bottom:none; }
  a.row:active { background:#fafafa; }
  .flag { font-size:14px; width:30px; flex-shrink:0; text-align:center; }
  .rname { font-weight:700; font-size:14px; }
  .raddr { color:#868e96; font-size:11.5px; }
  .rprice { color:#2f9e44; font-size:11.5px; font-weight:700; margin-top:2px; }
  .chev { margin-left:auto; color:#ced4da; font-size:18px; flex-shrink:0; }
  .maphint { font-size:11px; color:#adb5bd; text-align:center; margin:8px 0 2px; }

  .note { background:#fff4e6; border-radius:12px; padding:11px 14px; font-size:12.5px; color:#9c5800; margin:8px 4px; }
  .photo { background:#f3f0ff; border-radius:12px; padding:12px 14px; font-size:13px; color:#5f3dc4; margin:4px; }
  .footer { text-align:center; color:#ced4da; font-size:12px; padding:18px 0 28px; }
</style>

const PW = "hanacute";

function tryUnlock(){
  const v = (document.getElementById('pw').value||"").trim().toLowerCase();
  if(v === PW){
    sessionStorage.setItem('ok','1');
    reveal();
  } else {
    document.getElementById('err').textContent = "❌ 다시 확인해 주세요 / Sai rồi";
  }
}
function reveal(){
  document.getElementById('lock').style.display='none';
  document.getElementById('main').style.display='block';
  render();
}
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });

/* ---------- STATE ---------- */
let lang = localStorage.getItem('lang') || 'ko';
let tab = 'circus';      // circus | zoo
let zoo = 'zooA';        // zooA | zooB

function toggleLang(){ lang = (lang==='ko')?'vi':'ko'; localStorage.setItem('lang',lang); render(); }
function setTab(t){ tab=t; render(); }
function setZoo(z){ zoo=z; render(); }

function esc(s){ return s; }

function render(){
  const t = T[lang];
  document.documentElement.lang = (lang==='ko')?'ko':'vi';
  document.getElementById('brand').textContent = t.brand;
  document.getElementById('langbtn').textContent = t.langBtn;
  document.getElementById('tab-circus').textContent = t.circus;
  document.getElementById('tab-zoo').textContent = t.zoo;
  document.getElementById('sub-A').textContent = t.subA;
  document.getElementById('sub-B').textContent = t.subB;

  document.getElementById('tab-circus').className = (tab==='circus')?'on':'';
  document.getElementById('tab-zoo').className = (tab==='zoo')?'on':'';
  document.getElementById('subtabs').style.display = (tab==='zoo')?'flex':'none';
  document.getElementById('sub-A').className = (zoo==='zooA')?'on':'';
  document.getElementById('sub-B').className = (zoo==='zooB')?'on':'';

  const key = (tab==='circus')?'circus':zoo;
  const plan = D[key];
  const p = plan[lang];

  // theme
  const r = document.documentElement.style;
  r.setProperty('--grad', plan.theme.grad);
  r.setProperty('--accent', plan.theme.accent);
  r.setProperty('--accent-bg', plan.theme.bg);

  let h = '';
  h += `<div class="hero"><div class="tag">${p.tag}</div><h1>${p.title}</h1><div class="sub">${p.sub}</div></div>`;

  // schedule
  h += `<div class="sec"><div class="sec-title">${t.sched}</div><div class="sched">`;
  p.sched.forEach(row=>{
    const [time,what,place,map] = row;
    const placeHtml = map ? `<a href="${mapUrl(map)}" target="_blank">${place} 📍</a>` : place;
    h += `<div class="srow"><div class="stime">${time}</div><div class="swhat">${what}</div><div class="splace">${placeHtml}</div></div>`;
  });
  h += `</div></div>`;

  // food groups
  h += `<div class="sec"><div class="maphint">${t.maphint}</div>`;
  p.groups.forEach(g=>{
    h += `<div class="grp-label">${g[0]}</div><div class="list">`;
    g[1].forEach(it=>{
      const [flag,name,addr,map,price] = it;
      const pr = price ? `<div class="rprice">${price}</div>` : '';
      if(map){
        h += `<a class="row" href="${mapUrl(map)}" target="_blank"><div class="flag">${flag}</div><div><div class="rname">${name}</div><div class="raddr">${addr}</div>${pr}</div><div class="chev">›</div></a>`;
      } else {
        h += `<div class="row" style="cursor:default"><div class="flag">${flag}</div><div><div class="rname">${name}</div><div class="raddr">${addr}</div>${pr}</div></div>`;
      }
    });
    h += `</div>`;
  });
  h += `</div>`;

  // cafes
  if(p.cafes && p.cafes.length){
    h += `<div class="sec"><div class="sec-title">${t.cafe}</div><div class="list">`;
    p.cafes.forEach(c=>{
      const [name,addr,map,price] = c;
      const pr = price ? `<div class="rprice">${price}</div>` : '';
      h += `<a class="row" href="${mapUrl(map)}" target="_blank"><div class="flag">☕</div><div><div class="rname">${name}</div><div class="raddr">${addr}</div>${pr}</div><div class="chev">›</div></a>`;
    });
    h += `</div></div>`;
  }

  // note
  if(p.note){ h += `<div class="note">${p.note}</div>`; }

  // photo
  h += `<div class="sec"><div class="sec-title">${t.photo}</div><div class="photo">${p.photo}</div></div>`;

  document.getElementById('content').innerHTML = h;
}

// ---- 도망가는 "거절" 버튼 ----
const nope = document.getElementById('nope');
let nopeFixed = false;
function lockVisible(){ return document.getElementById('lock').style.display !== 'none'; }
function dodge(px, py){
  const bw = nope.offsetWidth, bh = nope.offsetHeight;
  const maxX = Math.max(5, window.innerWidth  - bw - 8);
  const maxY = Math.max(5, window.innerHeight - bh - 8);
  let nx, ny, tries = 0;
  do {
    nx = 5 + Math.random() * maxX;
    ny = 5 + Math.random() * maxY;
    tries++;
  } while (px != null && Math.hypot((nx+bw/2)-px, (ny+bh/2)-py) < 160 && tries < 25);
  if(!nopeFixed){ nope.style.position = 'fixed'; nope.style.margin = '0'; nopeFixed = true; }
  nope.style.left = nx + 'px';
  nope.style.top  = ny + 'px';
}
// 데스크탑: 커서가 가까워지면 도망
document.addEventListener('mousemove', e => {
  if(!lockVisible()) return;
  const r = nope.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  if(Math.hypot(e.clientX - cx, e.clientY - cy) < 95) dodge(e.clientX, e.clientY);
});
// 모바일: 누르려고 터치하는 순간 도망 (클릭 안 되게 preventDefault)
nope.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  dodge(t.clientX, t.clientY);
}, { passive:false });
// 혹시라도 클릭되면 또 도망
nope.addEventListener('click', e => { e.preventDefault(); dodge(window.innerWidth/2, window.innerHeight/2); });

// auto-unlock within session
if(sessionStorage.getItem('ok')==='1'){ reveal(); }
else { document.getElementById('pw').focus(); }
</script>
